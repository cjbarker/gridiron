[project]
name = "gridiron"
version = "0.1.0"
description = "College football statistical analysis of teams, players, and games"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gridiron" }]
dependencies = [
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "plotly>=5.20",
    "pyarrow>=15.0",
    # Auth: password hashing (Argon2), Google OAuth, form parsing, email validation,
    # and session-cookie signing (Starlette SessionMiddleware dependency).
    "authlib>=1.7",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.9",
    "email-validator>=2.0",
    "itsdangerous>=2.0",
]

# Optional extras enable production/bulk paths (the app runs offline without them):
#   postgres -> PostgreSQL driver   ·   bulk -> fast parquet reader for backfill
#   ml       -> logistic-regression prediction engine (the ratings engine needs no extras)
# Enable with: uv sync --extra postgres   (or `uv sync --all-extras`)
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
bulk = ["polars>=0.20"]
ml = ["scikit-learn>=1.4"]

# Dev tooling (PEP 735). Installed by default with `uv sync`. The prediction tests
# need the ML engine, so include scikit-learn here too.
[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4", "scikit-learn>=1.4"]

[project.scripts]
gridiron-ingest = "gridiron.ingest.cli:main"
gridiron-refresh = "gridiron.ingest.cli:refresh_main"
gridiron-initdb = "gridiron.db.init_db:main"
gridiron-admin = "gridiron.auth.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gridiron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
