[project]
name = "gridiron"
version = "0.1.0"
description = "College football statistical analysis of teams, players, and games"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gridiron" }]
dependencies = [
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "plotly>=5.20",
    "pyarrow>=15.0",
    # Optional but recommended data sources:
    #   cfbd          -> official CollegeFootballData API v2 Python client
    #   psycopg[binary]-> PostgreSQL driver (production DB)
    #   polars        -> fast parquet reader for bulk backfill
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
cfbd = ["cfbd>=5.0"]
bulk = ["polars>=0.20"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
gridiron-ingest = "gridiron.ingest.cli:main"
gridiron-initdb = "gridiron.db.init_db:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gridiron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
