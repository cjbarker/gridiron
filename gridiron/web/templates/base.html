<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gridiron{% endblock %}</title>
  <style>
    :root { --bg:#0b1220; --card:#141d2e; --ink:#e8edf6; --muted:#93a1b8; --accent:#4ea1ff; --line:#243149; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background:var(--bg); color:var(--ink); }
    a { color:var(--accent); text-decoration:none; }
    header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; }
    header h1 { font-size:20px; margin:0; }
    main { max-width:1000px; margin:0 auto; padding:24px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:600; }
    .score { font-variant-numeric: tabular-nums; font-weight:700; }
    .muted { color:var(--muted); }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:#1d2a42; font-size:12px; }
    select, input { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
    button { background:var(--accent); color:#06121f; border:none; border-radius:8px; padding:7px 14px; font-weight:600; cursor:pointer; }
    form.card label { margin-right:6px; }
    form.card > * { margin-right:8px; }
    nav a { margin-right:14px; color:var(--muted); }
    nav a:hover { color:var(--accent); }
    .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; }
    .stat { background:#1a2438; border:1px solid var(--line); border-radius:10px; padding:12px; }
    .stat .n { font-size:22px; font-weight:700; }
    .stat .l { color:var(--muted); font-size:12px; }
    .chart-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px; }
    .chart { min-height:320px; }
    .win { color:#38d39f; font-weight:700; } .loss { color:#e0568b; font-weight:700; }
  </style>
</head>
<body>
  <header>
    <h1><a href="/">🏈 Gridiron</a></h1>
    <nav>
      <a href="/">Games</a>
      <a href="/teams">Teams</a>
      <a href="/players">Players</a>
      <a href="/standings">Standings</a>
      <a href="/leaders">Leaders</a>
      <a href="/coaches">Coaches</a>
      <a href="/compare">Compare</a>
      <a href="/predict">Predict</a>
    </nav>
    <nav style="margin-left:auto;">
      {% if user %}
        {% if user.is_admin %}<a href="/admin/users">Admin</a>{% endif %}
        <span class="muted">{{ user.email }}</span>
        <form method="post" action="/logout" style="display:inline;margin:0;">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit"
                  style="background:none;color:var(--muted);padding:0;font-weight:400;">Log out</button>
        </form>
      {% else %}
        <a href="/login">Log in</a>
        <a href="/register">Register</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
