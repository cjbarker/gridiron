{% extends "base.html" %}
{% block title %}Log in · Gridiron{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:24px auto;">
  <h2 style="margin-top:0;">Log in</h2>
  {% if error %}<p class="loss">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <p><label>Email<br><input type="email" name="email" required autofocus style="width:100%"></label></p>
    <p><label>Password<br><input type="password" name="password" required style="width:100%"></label></p>
    <button type="submit">Log in</button>
  </form>
  {% if google_enabled %}
  <p style="margin-top:14px;"><a href="/auth/google/login?next={{ next }}">Continue with Google</a></p>
  {% endif %}
  <p class="muted" style="margin-top:14px;">
     <a href="/reset">Forgot your password?</a> ·
     No account? <a href="/register?next={{ next }}">Register</a></p>
</div>
{% endblock %}
